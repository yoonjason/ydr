name: HealGuide
options:
  bundleIdPrefix: com.yeongseok
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.4"
  generateEmptyDirectories: true

targets:
  HealGuide:
    type: application
    platform: macOS
    sources:
      - path: HealGuide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yeongseok.healguide
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HealGuide/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES

  HealGuideTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HealGuideTests
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HealGuide
